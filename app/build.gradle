apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
android {
    namespace 'ir.laptops.mobile'
    compileSdk 36
    useLibrary 'android.test.runner', false
    useLibrary 'android.test.base', false
    defaultConfig {
        applicationId 'ir.laptops.mobile'
        minSdk 26
        targetSdk 35
        versionCode 40000
        versionName '4.0.0'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
        buildConfigField 'String', 'SERVER_URL', '"https://13.42.221.242"'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Explicit local upgrade build: keep the certificate of the installed test APK.
            // Without this opt-in a separate production signing configuration is required.
            if (providers.gradleProperty('useInstalledSigningKey').orNull == 'true') {
                signingConfig signingConfigs.debug
            }
        }
    }
}
dependencies { testImplementation 'junit:junit:4.13.2'; testImplementation 'org.json:json:20240303' }

tasks.withType(Test).configureEach {
    systemProperty 'serverSource', System.getenv('LAPTOPS_SERVER_SOURCE') ?: new File(rootProject.projectDir.parentFile, 'laptop_manager').absolutePath
}
